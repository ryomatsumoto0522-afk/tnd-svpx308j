name: daily-digest

on:
  schedule:
    # GitHub の cron は数時間遅れたり、飛ばされたりすることがある（実測で最大 3.5 時間遅れ）。
    # 朝 7:00 JST までにメールが届くよう、未明に 3 回起動する（生成は数分で終わる）。今日の分が生成済みなら 2 回目以降は何もしない。
    # 毎時ちょうどは混雑しやすいので分をずらしている。
    - cron: "17 17 * * *" # 02:17 JST
    - cron: "47 18 * * *" # 03:47 JST
    - cron: "17 20 * * *" # 05:17 JST
  workflow_dispatch:
    inputs:
      force:
        description: "今日の分が生成済みでも作り直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 公開先の URL（完了メールに載せる）
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - name: 今日の分が生成済みか確認
        id: check
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          if [ -f "data/days/${today}.json" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "${today} は生成済みなので何もしません"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.done != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.check.outputs.done != 'true'
        run: npm ci

      - name: 型チェックとテスト
        if: steps.check.outputs.done != 'true'
        run: |
          npm run typecheck
          npm test

      - name: 収集・選定・要約・ページ生成
        if: steps.check.outputs.done != 'true'
        env:
          # 既定は Gemini（無料枠）。Claude を使うなら Variables に LLM_PROVIDER=anthropic を設定する
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: npm run build

      - name: 生成したページと状態をコミット
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "digest: $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      - name: 完了メールを送る
        if: steps.check.outputs.done != 'true'
        env:
          CI: "true"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: npm run notify:success

      - name: 失敗メールを送る
        if: failure()
        env:
          CI: "true"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run notify:failure
