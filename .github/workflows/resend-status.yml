name: resend-status

# メールが届かないときの調査用。Resend の直近の送信と配信状況（delivered / bounced など）をログに出す。
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run resend:status
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
